### Data Agent settings ###

# PROFILE_ID specifies the Profile identifier corresponding to the data profile on the modem, using
# which the Data Agent establishes the data connection.
# The specified Profile identifier should already be configured in the system.
#
# Possible PROFILE_ID values are from 0 to 255
# In absence of this configuration, the default value used is 1
PROFILE_ID=1

# AUTO_CONNECT_ON_BOOT specifies whether the Data Agent should bring up the data connection
# automatically after device boot, when the system is in appropriate state.
#
# Possible AUTO_CONNECT_ON_BOOT values are TRUE and FALSE
# In absence of this configuration, the default value used is TRUE
AUTO_CONNECT_ON_BOOT=TRUE

# AUTO_CONNECT_ON_RESUME specifies the Data Agent to establish a data connection automatically
# after system comes out of Suspend state, if the data connection doesn't exist already.
#
# Possible AUTO_CONNECT_ON_RESUME values are TRUE and FALSE
# In absence of this configuration, the default value used is TRUE
AUTO_CONNECT_ON_RESUME=TRUE

# RETRY_ON_DISCONNECTION specifies whether the Data Agent should retry establishing the data
# connection automatically, if the connection is lost unintentionally.
#
# Possible RETRY_ON_DISCONNECTION values are TRUE and FALSE
# In absence of this configuration, the default value used is TRUE
RETRY_ON_DISCONNECTION=TRUE


# SDK logging configuration. To be used for debugging.
CONSOLE_LOG_LEVEL=NONE
FILE_LOG_LEVEL=NONE
DIAG_LOG_LEVEL=DEBUG
